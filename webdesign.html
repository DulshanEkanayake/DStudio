<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Design Gallery</title>
    <style>
        :root {
            --bg-base: #0a0a0a;
            --bg-surface: #171717;
            --text-primary: #ededed;
            --accent: #00f2fe;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Segoe UI', sans-serif;
            padding: 2rem 5%;
            margin: 0;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 3rem auto;
        }

        .back-btn {
            color: var(--text-primary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid #262626;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        h1 span { color: var(--accent); }

        /* 🛠️ Flexbox Column 3 Layout */
        .gallery-grid {
            display: flex;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .gallery-item {
            background-color: var(--bg-surface);
            border: 1px solid #262626;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            position: relative;
            width: 100%;
        }

        .gallery-item:hover {
            transform: scale(1.03);
            border-color: var(--accent);
        }

        /* 🖼️ Normal Gallery එකේදී පින්තූර සහ වීඩියෝ */
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .gallery-item video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover; /* Normal Grid එකේදී ලස්සනට කොටුවට Fit වෙන්න */
        }

        /* 📝 Video Caption */
        .video-caption {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 24px;
            pointer-events: none;
            z-index: 2147483647;
            margin: 0;
            white-space: nowrap;
        }

        /* 📱 Responsive Mobile */
        @media (max-width: 768px) {
            .gallery-grid {
                flex-direction: column;
            }
        }

        /* 🎯 Fullscreen ගියාම වීඩියෝ එක ඇදෙන්නේ/කැපෙන්නේ නැතුව මැදට ගන්න CSS */
        #videoContainer:fullscreen {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            background-color: #000 !important;
        }

        #videoContainer:fullscreen video {
            width: auto !important;
            height: 100vh !important;
            object-fit: contain !important;
        }
    </style>
</head>
<body>

    <div class="header-area">
        <h1>Project <span>Gallery</span></h1>
        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <div class="gallery-grid">
        
        <!-- 1 වෙනි Column එක -->
        <div class="gallery-col">
            <div id="videoContainer" class="gallery-item">
                <video id="damiruVideo" class="gallery-img" autoplay loop muted playsinline controls style="cursor: pointer;">
                    <source src="damiru.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <h3 class="video-caption">Happy Birthday Sithmi...</h3>
            </div>
            <div class="gallery-item">
                <img src="IMG-20250905-WA0002.jpg" alt="damiru 1">
            </div>
        </div>

        <!-- 2 වෙනි Column එක -->
        <div class="gallery-col">
            <div class="gallery-item">
                <img src="IMG-20251019-WA0004.jpg" alt="tashmika 1">
            </div>
        </div>

        <!-- 3 වෙනි Column එක -->
        <div class="gallery-col">
            <div class="gallery-item">
                <img src="IMG-20251008-WA0008.jpg" alt="tashmika 2">
            </div>
        </div>
        
    </div>

    <script>
        const video = document.getElementById('damiruVideo');
        const container = document.getElementById('videoContainer'); 

        video.addEventListener('click', function() {
            const isFullscreen = document.fullscreenElement || 
                                 document.webkitFullscreenElement || 
                                 document.msFullscreenElement;

            if (!isFullscreen) {
                video.muted = false; 
                video.controls = true; 
                
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
                
                video.play();
            }
        });

        function handleFullscreenExit() {
            const isFullscreen = document.fullscreenElement || 
                                 document.webkitFullscreenElement || 
                                 document.msFullscreenElement;
            
            if (!isFullscreen) {
                video.muted = true;
                video.controls = false; 
            }
        }

        // 🛠️ මෙන්න මෙතන තිබ්බ spelling වැරැද්ද Fix කළා මචං
        document.addEventListener('fullscreenchange', handleFullscreenExit);
        document.addEventListener('webkitfullscreenchange', handleFullscreenExit);
        document.addEventListener('msfullscreenchange', handleFullscreenExit);
    </script>

</body>
</html>
